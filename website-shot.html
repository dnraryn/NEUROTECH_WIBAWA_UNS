<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>NeuroTech — Website Mockup</title>

<!-- Make every scroll-reveal element visible immediately (no scrolling in a screenshot) -->
<script>
  window.IntersectionObserver = function (cb) {
    return {
      observe: function (el) { cb([{ isIntersecting: true, target: el }]); },
      unobserve: function () {}, disconnect: function () {}, takeRecords: function () { return []; },
    };
  };
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 1120px; overflow: hidden;
    background:
      radial-gradient(58% 42% at 10% -4%, rgba(42,95,224,0.32), transparent 70%),
      radial-gradient(54% 44% at 97% 106%, rgba(47,212,238,0.18), transparent 70%),
      linear-gradient(165deg, #050b1a 0%, #0a1531 40%, #102a5c 76%, #16407e 100%);
    font-family: 'Manrope', 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .shot { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .head { text-align: center; }
  .head .brand { font-size: 29px; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
  .head .brand .accent {
    background: linear-gradient(90deg, #4ec3e0, #9c8bf0);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .head .sub { font-size: 11px; letter-spacing: 0.30em; text-transform: uppercase; color: #8fa8cc; margin-top: 7px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 38px 46px; }
  .cell { display: flex; flex-direction: column; }
  .cap {
    font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
    color: #9fc6e8; margin-bottom: 9px; text-align: center;
  }
  .bwin {
    width: 538px; border-radius: 13px; overflow: hidden;
    box-shadow: 0 22px 52px rgba(4,10,30,0.62), 0 0 0 1px rgba(255,255,255,0.07);
  }
  .bwin-bar {
    height: 31px; background: #0c1730; display: flex; align-items: center; padding: 0 13px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .bwin-bar .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; }
  .bwin-bar .url {
    margin-left: 12px; font-size: 10px; color: #8094b6; font-family: 'JetBrains Mono', monospace;
    background: #070e22; padding: 4px 14px; border-radius: 6px;
  }
  .bwin-view { width: 538px; height: 378px; overflow: hidden; position: relative; background: #0a1531; }
  .bwin-scale { width: 1280px; transform: scale(0.42); transform-origin: top left; pointer-events: none; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="router.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="mock-data.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>
  <script type="text/babel" src="auth-login.jsx"></script>
  <script type="text/babel" src="join.jsx"></script>
  <script type="text/babel" src="content-pages.jsx"></script>

  <script type="text/babel">
    const PAGES = [
      { cap: "Landing Page",          url: "neurotech-id.web.app",                     node: <LandingPage /> },
      { cap: "About NeuroTech",       url: "neurotech-id.web.app/#/p/about-neurotech",  node: <ContentPage slug="about-neurotech" /> },
      { cap: "Bergabung dengan Kami", url: "neurotech-id.web.app/#/join",               node: <JoinFlow /> },
      { cap: "Login Anggota",         url: "neurotech-id.web.app/#/login",              node: <MemberLogin /> },
    ];

    const Win = ({ p }) => (
      <div className="cell">
        <div className="cap">{p.cap}</div>
        <div className="bwin">
          <div className="bwin-bar">
            <span className="dot" style={{ background: "#ff5f57" }} />
            <span className="dot" style={{ background: "#febc2e" }} />
            <span className="dot" style={{ background: "#28c840" }} />
            <span className="url">{p.url}</span>
          </div>
          <div className="bwin-view">
            <div className="bwin-scale">{p.node}</div>
          </div>
        </div>
      </div>
    );

    const Shot = () => (
      <div className="shot">
        <div className="head">
          <div className="brand">neuro<span className="accent">tech</span></div>
          <div className="sub">Tampilan Halaman Website</div>
        </div>
        <div className="grid">
          {PAGES.map((p, i) => <Win key={i} p={p} />)}
        </div>
      </div>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<Shot />);
  </script>
</body>
</html>
